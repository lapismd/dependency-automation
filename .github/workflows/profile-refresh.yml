name: Refresh organization npm profile
on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"
permissions:
  contents: read
concurrency:
  group: organization-npm-profile
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || vars.LAPIS_PROFILE_REFRESH_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: lapismd/.github
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.15.0"
      - id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Generate using the source-owned public registry reader
        run: node scripts/update-npm-status.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: profile-candidate
          path: profile/README.md
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: prepare
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.15.0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: profile-candidate
          path: candidate
      - name: Mint one-repository writer token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.LAPIS_DEPENDENCY_APP_CLIENT_ID }}
          private-key: ${{ secrets.LAPIS_DEPENDENCY_APP_PRIVATE_KEY }}
          owner: lapismd
          repositories: .github
          permission-contents: write
          permission-pull-requests: write
      - name: Validate allowed diff and publish with branch history preserved
        run: node scripts/publish-profile.mjs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PROFILE_SOURCE_SHA: ${{ needs.prepare.outputs.source }}
