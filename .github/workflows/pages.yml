name: Publish dependency automation specification
on:
  push:
    branches: [main]
    paths:
      - spec/**
      - spec-validator.config.mjs
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/check.yml
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  book:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.15.0"
      - run: corepack enable && corepack prepare pnpm@10.34.5 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: mdbook@0.5.4
      - uses: lapismd/lapis-ci/actions/setup-gh@bfa9743d8b403681ef7fb81ae3c5e53a99e3de55 # gh 2.102.0
      - run: pnpm verify
      - name: Mark book as a static Pages artifact
        run: touch spec/book/.nojekyll
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: spec/book
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: book
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
