name: Audit maintenance policy
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maintenance-policy-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.15.0"
      - run: corepack enable && corepack prepare pnpm@10.34.5 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm maintenance:audit
        env:
          GH_TOKEN: ${{ github.token }}
          LAPIS_DEPENDENCY_WRITES: ${{ vars.LAPIS_DEPENDENCY_WRITES }}
          LAPIS_DEPENDENCY_PHASE: ${{ vars.LAPIS_DEPENDENCY_PHASE }}
          LAPIS_DEPENDENCY_WAVES: ${{ vars.LAPIS_DEPENDENCY_WAVES }}
          LAPIS_DEPENDENCY_SCHEDULE: ${{ vars.LAPIS_DEPENDENCY_SCHEDULE }}
          LAPIS_DEPENDENCY_WAVE_STATE_WRITES: ${{ vars.LAPIS_DEPENDENCY_WAVE_STATE_WRITES }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: maintenance-policy-audit
          path: reports/maintenance-audit.json
          if-no-files-found: error
          retention-days: 14
